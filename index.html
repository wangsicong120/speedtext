<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="refresh" content="0;url=./frontend/index.html">
  <meta name="description" content="Speedtext 已升级为独立前端与 Cloudflare Workers API。">
  <title>流量消耗器 · Speedtext</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
    }
    .wrap {
      position: relative;
      padding: 32px 48px;
      border-radius: 12px;
      background: #1e293b;
      overflow: hidden;
      text-align: center;
    }
    /* 流光边框动画 */
    .wrap::before {
      content: "";
      position: absolute;
      inset: -2px;
      background: linear-gradient(90deg,#38bdf8,#a855f7,#38bdf8,#22c55e,#38bdf8);
      background-size: 400% 400%;
      animation: flowLight 3s linear infinite;
      z-index: -1;
      border-radius: 14px;
    }
    @keyframes flowLight {
      0% { background-position: 0% 50%; }
      100% { background-position: 400% 50%; }
    }
    p {
      margin: 8px 0;
    }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 500;
    }
    a:hover {
      color: #a855f7;
      text-decoration: underline;
    }
    .small-tip {
      font-size: 14px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p>正在打开新版：<a href="./frontend/index.html">进入流量消耗器</a>。</p>
    <p class="small-tip">完整部署请使用仓库中的 Workers 构建配置；直接静态托管时不提供本站 IP API。</p>
  </div>
</body>
</html>
