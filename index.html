    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 40px 20px;
            color: #fff;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            padding: 30px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        select,
        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:focus,
        input[type="text"]:focus {
            border-color: #667eea;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        button {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
        }

        .btn-stop {
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
        }

        .result {
            margin-top: 25px;
            display: none;
        }

        .result.active {
            display: block;
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .result-item {
            background: #f8f9ff;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .result-item .value {
            font-size: 24px;
            font-weight: 700;
            color: #667eea;
            margin-top: 5px;
        }

        .result-item .label {
            font-size: 13px;
            color: #888;
        }

        .log-box {
            background: #1e1e2e;
            color: #cdd6f4;
            padding: 15px;
            border-radius: 8px;
            height: 200px;
            overflow-y: auto;
            font-family: Consolas, Monaco, monospace;
            font-size: 12px;
            margin-top: 20px;
        }

        .log-box div {
            margin-bottom: 4px;
            line-height: 1.5;
        }

        .log-box .ok {
            color: #a6e3a1;
        }

        .log-box .err {
            color: #f38ba8;
        }

        .log-box .info {
            color: #89b4fa;
        }

        option[disabled] {
            background: #f1f3fb;
            color: #667eea;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 24px;
            }

            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>

            <div class="result" id="result">
                <div class="result-grid">
                    <div class="result-item">

                        <div class="value" id="totalSize">0 B</div>
                    </div>
                    <div class="result-item">
                        <div class="label">当前速度</div>
                        <div class="value" id="speed">0 B/s</div>
                    </div>
                    <div class="result-item">
                        <div class="label">请求次数</div>
                        <div class="value" id="requestCount">0</div>
                    </div>
                    <div class="result-item">
                        <div class="label">运行时长</div>
                        <div class="value" id="duration">0 s</div>
                    </div>
                </div>

    <script>
        const select = document.getElementById('select');
        const link = document.getElementById('link');
        const btnStart = document.getElementById('btnStart');
        const btnStop = document.getElementById('btnStop');
        const result = document.getElementById('result');
        const totalSizeEl = document.getElementById('totalSize');
        const speedEl = document.getElementById('speed');
        const requestCountEl = document.getElementById('requestCount');
        const durationEl = document.getElementById('duration');
        const logBox = document.getElementById('logBox');

        let running = false;
        let totalSize = 0;
        let requestCount = 0;
        let startTime = 0;
        let lastSize = 0;
        let lastTime = 0;
        let timer = null;
        let speedTimer = null;
        let abortControllers = [];

        select.addEventListener('change', () => {
            link.value = select.value;
        });

        function log(msg, type = 'info') {
            const time = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${time}] ${msg}`;
            logBox.appendChild(div);
            logBox.scrollTop = logBox.scrollHeight;
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(2) + ' KB';
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(2) + ' MB';
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + ' GB';
        }

        function formatSpeed(bytesPerSecond) {
            return formatSize(bytesPerSecond) + '/s';
        }

        async function downloadOnce(url) {
            const controller = new AbortController();
            abortControllers.push(controller);

            try {
                const resp = await fetch(url, {
                    method: 'GET',
                    cache: 'no-store',
                    signal: controller.signal
                });

                if (!resp.ok) {
                    log('请求失败: HTTP ' + resp.status, 'err');
                    return;
                }

                const reader = resp.body.getReader();
                requestCount++;
                requestCountEl.textContent = requestCount;

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    if (!running) {
                        controller.abort();
                        break;
                    }
                    totalSize += value.length;
                    totalSizeEl.textContent = formatSize(totalSize);
                }
            } catch (e) {
                if (e.name !== 'AbortError') {
                    log('请求异常: ' + e.message, 'err');
                }
            }
        }

        async function startTest() {
            const url = link.value.trim();
            if (!url) {
                log('请先选择或输入测试地址', 'err');
                return;
            }

            if (!/^https?:\/\//i.test(url)) {
                log('URL 必须以 http:// 或 https:// 开头', 'err');
                return;
            }

            running = true;
            totalSize = 0;
            requestCount = 0;
            lastSize = 0;
            lastTime = Date.now();
            startTime = Date.now();
            abortControllers = [];

            result.classList.add('active');
            totalSizeEl.textContent = '0 B';
            speedEl.textContent = '0 B/s';
            requestCountEl.textContent = '0';
            durationEl.textContent = '0 s';
            logBox.innerHTML = '';

            log('开始测试: ' + url, 'info');
            log('持续下载中，请观察速度与流量变化...', 'info');

            timer = setInterval(() => {
                if (!running) return;
                downloadOnce(url);
            }, 500);

            speedTimer = setInterval(() => {
                if (!running) return;
                const now = Date.now();
                const duration = (now - startTime) / 1000;
                const bytes = totalSize - lastSize;
                const time = (now - lastTime) / 1000;
                const speed = time > 0 ? bytes / time : 0;

                speedEl.textContent = formatSpeed(speed);
                durationEl.textContent = duration.toFixed(1) + ' s';

                lastSize = totalSize;
                lastTime = now;
            }, 1000);

            downloadOnce(url);
        }

        function stopTest() {
            running = false;
            clearInterval(timer);
            clearInterval(speedTimer);

            abortControllers.forEach(c => {
                try { c.abort(); } catch (e) {}
            });
            abortControllers = [];

            log('测试已停止', 'ok');
            log('总计下载: ' + formatSize(totalSize), 'ok');
        }

        btnStart.addEventListener('click', startTest);
        btnStop.addEventListener('click', stopTest);
    </script>
